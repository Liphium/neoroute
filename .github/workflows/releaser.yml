name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize runs: a release merge + its updater commit must not interleave.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Creates/updates per-package release PRs (separate-pull-requests: true)
      # and, when a release PR was just merged, tags + publishes the releases.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # After release-please (and on every plain push to main): point every module
  # at the latest released versions of its neoroute dependencies. Commits
  # directly to main, no PRs. Never touches release PR branches.
  updater:
    needs: release-please
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Update cross-module dependencies
        run: bash scripts/update-deps.sh
        env:
          GH_TOKEN: ${{ github.token }}
