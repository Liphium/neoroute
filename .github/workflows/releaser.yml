name: Releaser

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  releaser:
    if: startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Release stuff from the first step in the dependency tree
      - uses: googleapis/release-please-action@v4
        id: release-1
        with:
          config-file: release-please-first.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Commit with the newest version first
      - name: Set git config for action use
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Run step 1 (transporters)
        run: node scripts/get-tree.js 1 ${{ github.head_ref || github.ref_name }}

      - name: Run step 2 (neodebug)
        run: node scripts/get-tree.js 2 ${{ github.head_ref || github.ref_name }}

      - name: Run step 3 (chat_server example)
        run: node scripts/get-tree.js 3 ${{ github.head_ref || github.ref_name }}
