name: Updater

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  updater:
    if: ${{ !startsWith(github.event.head_commit.message, 'Merge pull request') }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
